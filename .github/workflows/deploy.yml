name: Despliegue Automatico Animalia
on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Subir cambios a Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo del repo
        uses: actions/checkout@v4

      - name: Sincronizar archivos a animalia_core
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            vendor/**
            storage/**
            public/**
            bootstrap/cache/*.php
            .env